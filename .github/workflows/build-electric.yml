name: Build Electric bundle

on:
  workflow_dispatch:
    inputs:
      reuse_codex:
        description: Reuse the identical attested Codex binary from Electric v1.9.1
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 340
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: rustup toolchain install 1.95.0 1.96.1 --profile minimal
      - if: inputs.reuse_codex
        name: Verify previous Electric release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.9.1 --repo rm0nroe/herdr-electric --pattern '*.tar.gz' --output "$RUNNER_TEMP/previous.tar.gz"
          gh attestation verify "$RUNNER_TEMP/previous.tar.gz" --repo rm0nroe/herdr-electrified
      - name: Build Electric
        env:
          REUSE_CODEX: ${{ inputs.reuse_codex }}
        run: |
          args=()
          if [[ "$REUSE_CODEX" == "true" ]]; then args+=(--released-codex "$RUNNER_TEMP/previous.tar.gz"); fi
          python3.12 scripts/build-electric.py "$RUNNER_TEMP/electric" "${args[@]}"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/electric/herdr-electrified-*-macos-arm64.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: electric-bundle
          path: |
            ${{ runner.temp }}/electric/herdr-electrified-*-macos-arm64.tar.gz
            ${{ runner.temp }}/electric/SHA256SUMS
          compression-level: 0
